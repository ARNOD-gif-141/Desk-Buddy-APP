name: Build Arno Link Desktop (Windows .exe)

on:
  workflow_dispatch:
  push:
    paths: ["desktop/**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyserial bleak pyinstaller
      - run: pyinstaller --onefile --noconsole --name ArnoLinkDesktop --collect-all bleak arno_link_desktop.py
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ArnoLinkDesktop-exe
          path: desktop/dist/ArnoLinkDesktop.exe
